name: Deploy vpn-site

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          command_timeout: 30m
          script: |
            set -e
            cd /root/opt/vpn-site
            git fetch origin main
            git reset --hard origin/main
            npm install
            npm run build
            pm2 restart vpn-site || pm2 start .output/server/index.mjs --name vpn-site
            pm2 save
